# Non-secret project defaults.
# Keep tokens and credentials in .env or a secret manager, not here.

[host]
debug = false
project_name = "Kevin"
api_prefix = "/api"
host = "127.0.0.1"
port = 8020
domain = "http://localhost:8020"
cors_origins = []

[agent]
protocol = "openai-chat"
timeout = 60.0
max_tokens = 16384
max_tool_iterations = 40
system_prompt = ""
enabled_tools = ""
skills = ""
workspace_root = ".kevin/workspaces"
run_store = "json"
run_root = ".kevin/runs"
state_path = ".kevin/host/state.json"
http_proxy = ""
https_proxy = ""
all_proxy = ""
max_retries = 3
retry_base_delay = 1.0
max_context_tokens = 256000
max_concurrent_tools = 10
max_concurrent_requests = 20
tool_timeout = 60.0
tool_use_summary_model = ""
context_compaction_model = ""
guided_tools = ""
builtin_tools = "filesystem.read,filesystem.list,filesystem.write,filesystem.delete,filesystem.move,search.grep,search.glob,patch.apply,git.status,git.diff,git.log,git.show,git.add,git.commit,shell.run,shell.output,shell.backgrounds,shell.kill,test.discover,test.run,sleep.wait,web.search,web.extract,web.map,browser.open,browser.download,notebook.edit,lsp.query,worktree.enter,worktree.exit,tool.search,mcp.servers,mcp.configure,mcp.enable,mcp.disable,mcp.remove,mcp.clear,mcp.prompts,mcp.get_prompt,mcp.resources,mcp.read_resource,skill.discover,skill.invoke,skill.install,skill.uninstall,skill.use,skill.disable,plugin.discover,plugin.install,plugin.uninstall,plugin.enable,plugin.disable,agent.profiles,agent.save_profile,agent.run,team.create,team.delete,team.members,team.send,team.inbox,team.run_member,task.create,task.list,task.get,task.update,task.stop,task.output,task.run,task.background,task.backgrounds,schedule.create,schedule.list,schedule.delete,schedule.run,memory.list,memory.add,memory.edit,memory.forget,todo.write,todo.read,plan.enter,plan.status,plan.exit,session.status,session.export,session.summary,context.trace,context.messages,context.compact,context.rewind,permission.status,permission.sources,permission.explain,permission.add_rule,hook.events,hook.list,hook.add,hook.delete,structured.output,config.manage,user.ask,user.message,command.discover,command.render,command.read,command.save,command.delete,prompt.templates,prompt.read,prompt.render,prompt.save,prompt.delete,workflow.templates,workflow.read,workflow.save,workflow.delete,workflow.validate,workflow.run,workflow.run_saved"
sandbox_profile = "restricted"
sandbox_provider = "local"
sandbox_image = "node:22-alpine"
sandbox_network = ""
sandbox_memory = ""
sandbox_cpus = ""
sandbox_ttl_seconds = 0
sandbox_workdir = "/workspace"
sandbox_allowed_commands = "git,node,npm,bun,make"
memory_context_limit = 20
context_compaction_target_tokens = 32000
claude_base_url = ""
claude_model = ""

[models.openai]
base_url = "https://api.openai.com/v1"
model = ""

[models.openai_responses]
base_url = "https://api.openai.com/v1"
model = ""

[models.anthropic]
base_url = "https://api.anthropic.com/v1"
model = ""

[models.gemini]
base_url = "https://generativelanguage.googleapis.com/v1"
model = ""

[mcp]
server_name = ""
server_command = ""
client_timeout = 30.0
execution_mode = "trusted_control_plane"
sandbox_profile = ""

[web_search]
provider = "none"
tavily_base_url = "https://api.tavily.com"
timeout = 30.0
max_results = 5
max_credits_per_run = 10.0
allow_domains = ""
deny_domains = ""
allow_advanced = false
allow_raw_content = false

[log]
log_level = "INFO"
