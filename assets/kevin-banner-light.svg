<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Kevin">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#c6c9c1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f5f2" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#f4f5f2" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f4f5f2" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6b5f"/>
      <stop offset="1" stop-color="#16734f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="#f4f5f2"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="24" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" fill="none" stroke="#dddeda"/>

  <!-- mark -->
  <g transform="translate(120 96)">
    <rect width="128" height="128" rx="32" fill="url(#mark)"/>
    <path d="M40 34 V94 M40 66 L74 34 M52 56 L80 94" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="86" y="84" width="16" height="10" rx="2" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text x="284" y="186" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-3" fill="#20221f">Kevin</text>
  <text x="290" y="226" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="17" letter-spacing="0.3" fill="#6d716b">personal agent · local runtime · any model</text>

  <!-- trace card -->
  <g transform="translate(836 64)" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15">
    <rect width="348" height="192" rx="16" fill="#ffffff" stroke="#dddeda"/>
    <circle cx="24" cy="24" r="5" fill="#c6c9c1"/><circle cx="42" cy="24" r="5" fill="#c6c9c1"/><circle cx="60" cy="24" r="5" fill="#c6c9c1"/>
    <line x1="0" y1="44" x2="348" y2="44" stroke="#dddeda"/>
    <text x="24" y="76" fill="#6d716b">›</text><text x="44" y="76" fill="#20221f">fix the flaky test</text>
    <line x1="30" y1="106" x2="30" y2="162" stroke="#dddeda" stroke-width="2"/>
    <circle cx="30" cy="106" r="4" fill="#0f6b5f"/><text x="44" y="111" fill="#6d716b">search.grep</text><text x="322" y="111" text-anchor="end" fill="#0f6b5f">ok</text>
    <circle cx="30" cy="134" r="4" fill="#0f6b5f"/><text x="44" y="139" fill="#6d716b">patch.apply</text><text x="322" y="139" text-anchor="end" fill="#0f6b5f">ok</text>
    <circle cx="30" cy="162" r="4" fill="#a96f16"/><text x="44" y="167" fill="#6d716b">test.run</text><text x="322" y="167" text-anchor="end" fill="#a96f16">approve?</text>
  </g>
</svg>
