services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ${IMAGE:-agents}:${TAG:-latest}
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - DEBUG=False
      - HOST=0.0.0.0
      - ACCESS_TOKEN=${ACCESS_TOKEN:?Set ACCESS_TOKEN for the container host}
      - PORT=8020
    ports:
      - "127.0.0.1:${PORT:-8020}:8020"
    volumes:
      - ../logs:/opt/app/logs
      - ../cache:/opt/app/cache
      - ../.kevin:/opt/app/.kevin
